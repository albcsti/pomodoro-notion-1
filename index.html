<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro — Cozy Autumn</title>

<style>
  :root{
    --bg:#f4eee7;
    --card:#fbf8f4;
    --ink:#4b372d;
    --muted:#8b7669;
    --accent:#8a5b43;
    --accent2:#c9a58d;
    --line:#dfd2c7;
    --done:#7a4d38;
    --soft:#eee5dd;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:transparent;
    color:var(--ink);
    font-family:Inter, ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:12px 10px 16px;
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(0, 1fr) 360px;
    gap:26px;
    align-items:start;
  }

  /* =========================
     POMODORO
  ========================= */

  .card{
    background:transparent;
    border:none;
    border-radius:0;
    padding:28px;
  }

  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:7px;
  }

  h1{
    font-size:25px;
    margin:0;
    font-weight:650;
    letter-spacing:-.03em;
  }

  .phase{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
    font-size:13px;
    color:var(--muted);
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
  }

  .timer{
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-size:76px;
    line-height:1;
    font-weight:650;
    letter-spacing:-.055em;
    margin:38px 0 28px;
    color:var(--ink);
  }

  .controls{
    display:flex;
    justify-content:center;
    gap:10px;
  }

  button{
    border:0;
    border-radius:13px;
    padding:11px 17px;
    font:inherit;
    font-size:13px;
    font-weight:650;
    cursor:pointer;
    transition:.15s ease;
  }

  button:hover{
    transform:translateY(-1px);
  }

  .primary{
    background:var(--accent);
    color:#fff;
  }

  .secondary{
    background:var(--soft);
    color:var(--ink);
  }

  .ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
  }

  .settings{
    margin-top:28px;
    padding-top:24px;
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }

  label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted);
    font-weight:700;
    margin-bottom:7px;
  }

  select{
    width:100%;
    appearance:none;
    background:#f5eee8;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:11px;
    padding:10px 12px;
    font:inherit;
    font-size:13px;
    outline:none;
  }

  .progress{
    margin-top:25px;
  }

  .progress-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }

  .progress-title{
    font-size:13px;
    font-weight:650;
  }

  .count{
    font-size:12px;
    color:var(--muted);
  }

  .bar{
    height:8px;
    background:#e8ddd4;
    border-radius:99px;
    overflow:hidden;
  }

  .fill{
    height:100%;
    width:0;
    background:var(--accent);
    border-radius:99px;
    transition:width .3s ease;
  }

  .sessions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:12px;
  }

  .session{
    width:29px;
    height:8px;
    border-radius:99px;
    background:#ded1c6;
    transition:.25s ease;
  }

  .session.done{
    background:var(--done);
  }

  .session.current{
    background:var(--accent2);
    box-shadow:0 0 0 2px #eadbd0;
  }

  .tip{
    margin-top:23px;
    text-align:center;
    font-size:11px;
    color:var(--muted);
  }


  /* =========================
     SPOTIFY
  ========================= */

  .spotify-card{
    padding:28px 0;
  }

  .spotify-header{
    margin-bottom:14px;
  }

  .spotify-eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:7px;
  }

  .spotify-title{
    margin:0;
    font-size:20px;
    font-weight:650;
    letter-spacing:-.025em;
  }

  .spotify-subtitle{
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
  }

  .spotify-frame{
    border-radius:18px;
    overflow:hidden;
    background:#1f1b19;
    box-shadow:0 10px 30px rgba(73,52,40,.08);
  }

  .spotify-frame iframe{
    display:block;
    width:100%;
    height:352px;
    border:0;
  }

  .spotify-note{
    margin-top:10px;
    text-align:center;
    font-size:10px;
    color:var(--muted);
  }


  /* =========================
     RESPONSIVE
  ========================= */

  @media(max-width:850px){

    .layout{
      grid-template-columns:1fr;
      gap:0;
    }

    .spotify-card{
      padding:10px 28px 28px;
    }

  }

  @media(max-width:560px){

    .settings{
      grid-template-columns:1fr;
    }

    .timer{
      font-size:60px;
    }

    .card{
      padding:22px;
    }

    .spotify-card{
      padding:10px 22px 22px;
    }

    .spotify-frame iframe{
      height:352px;
    }

    .controls{
      flex-wrap:wrap;
    }
  }

</style>
</head>


<body>

<div class="wrap">

  <div class="layout">

    <!-- =====================
         POMODORO
    ====================== -->

    <div class="card">

      <div class="top">

        <div>

          <div class="eyebrow">
            Focus time
          </div>

          <h1>
            Pomodoro
          </h1>

          <div class="phase">
            <span class="dot"></span>
            <span id="phaseText">
              Prête à commencer
            </span>
          </div>

        </div>

      </div>


      <div class="timer" id="timer">
        25:00
      </div>


      <div class="controls">

        <button class="primary" id="startBtn">
          Lancer
        </button>

        <button class="secondary" id="pauseBtn">
          Pause
        </button>

        <button class="ghost" id="resetBtn">
          Réinitialiser
        </button>

      </div>


      <div class="settings">

        <div>

          <label for="sessions">
            Sessions
          </label>

          <select id="sessions">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option selected>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
          </select>

        </div>


        <div>

          <label for="work">
            Session
          </label>

          <select id="work">
            <option value="15">15 min</option>
            <option value="20">20 min</option>
            <option value="25" selected>25 min</option>
            <option value="30">30 min</option>
            <option value="40">40 min</option>
            <option value="45">45 min</option>
            <option value="50">50 min</option>
            <option value="60">60 min</option>
          </select>

        </div>


        <div>

          <label for="break">
            Pause
          </label>

          <select id="break">
            <option value="3">3 min</option>
            <option value="5" selected>5 min</option>
            <option value="10">10 min</option>
            <option value="15">15 min</option>
            <option value="20">20 min</option>
            <option value="30">30 min</option>
          </select>

        </div>

      </div>


      <div class="progress">

        <div class="progress-head">

          <span class="progress-title">
            Progression
          </span>

          <span class="count" id="count">
            0 / 4 sessions
          </span>

        </div>


        <div class="bar">
          <div class="fill" id="fill"></div>
        </div>


        <div class="sessions" id="sessionsVisual"></div>

      </div>


      <div class="tip">
        Choisis ton rythme, puis lance ta première session.
      </div>

    </div>


    <!-- =====================
         SPOTIFY
    ====================== -->

    <div class="spotify-card">

      <div class="spotify-header">

        <div class="spotify-eyebrow">
          Now playing
        </div>

        <h2 class="spotify-title">
          My focus playlist ♫
        </h2>

        <div class="spotify-subtitle">
          Une petite ambiance pour accompagner tes sessions.
        </div>

      </div>


      <div class="spotify-frame">

        <iframe
          src="https://open.spotify.com/embed/playlist/72ZHp2XuEhPbTgwY1UD3qH?utm_source=generator"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>

      </div>


      <div class="spotify-note">
        Ouvre Spotify pour écouter la playlist en entier.
      </div>

    </div>

  </div>

</div>


<script>

(() => {

  const $ = id => document.getElementById(id);

  let timerId = null;
  let running = false;
  let mode = "work";
  let currentSession = 1;
  let remaining = 25 * 60;


  const sessions = $("sessions");
  const work = $("work");
  const breakTime = $("break");

  const timer = $("timer");
  const phaseText = $("phaseText");
  const count = $("count");
  const fill = $("fill");
  const visual = $("sessionsVisual");


  function totalSessions(){
    return Number(sessions.value);
  }


  function renderVisual(){

    visual.innerHTML = "";

    for(let i = 1; i <= totalSessions(); i++){

      const el = document.createElement("span");

      el.className =
        "session " +
        (
          i < currentSession
            ? "done"
            : i === currentSession && mode === "work"
              ? "current"
              : ""
        );

      visual.appendChild(el);

    }

    const completed =
      Math.min(
        currentSession - 1,
        totalSessions()
      );

    count.textContent =
      `${completed} / ${totalSessions()} sessions`;

    fill.style.width =
      `${(completed / totalSessions()) * 100}%`;

  }


  function setPhase(){

    if(mode === "work"){

      phaseText.textContent =
        `Session ${currentSession} · concentration`;

    }else{

      phaseText.textContent =
        `Pause · avant la session ${currentSession}`;

    }

  }


  function formatTime(sec){

    const m = Math.floor(sec / 60);
    const s = sec % 60;

    return (
      `${String(m).padStart(2,"0")}:` +
      `${String(s).padStart(2,"0")}`
    );

  }


  function update(){

    timer.textContent =
      formatTime(remaining);

    document.title =
      `${formatTime(remaining)} · Pomodoro`;

  }


  function loadSettings(reset = true){

    if(reset){

      mode = "work";
      currentSession = 1;
      remaining = Number(work.value) * 60;

      running = false;

      clearInterval(timerId);
      timerId = null;

      $("startBtn").textContent =
        "Lancer";

      phaseText.textContent =
        "Prête à commencer";

    }

    renderVisual();
    update();

  }


  function finishPhase(){

    if(mode === "work"){

      if(currentSession >= totalSessions()){

        running = false;

        clearInterval(timerId);
        timerId = null;

        phaseText.textContent =
          "Terminé · bravo ♡";

        remaining = 0;

        update();
        renderVisual();

        $("startBtn").textContent =
          "Recommencer";

        return;

      }

      mode = "break";

      remaining =
        Number(breakTime.value) * 60;

      phaseText.textContent =
        "Pause · respire un peu";

    }else{

      currentSession++;

      mode = "work";

      remaining =
        Number(work.value) * 60;

      setPhase();

    }

    renderVisual();
    update();

  }


  function tick(){

    if(remaining > 0){

      remaining--;

      update();

    }

    if(remaining === 0){

      finishPhase();

    }

  }


  $("startBtn").addEventListener(
    "click",
    () => {

      if(!running){

        if(remaining === 0){

          loadSettings(true);

        }

        running = true;

        $("startBtn").textContent =
          "En cours";

        setPhase();

        clearInterval(timerId);

        timerId =
          setInterval(tick, 1000);

      }

    }
  );


  $("pauseBtn").addEventListener(
    "click",
    () => {

      if(running){

        running = false;

        clearInterval(timerId);
        timerId = null;

        $("startBtn").textContent =
          "Reprendre";

        phaseText.textContent =
          "En pause";

      }

    }
  );


  $("resetBtn").addEventListener(
    "click",
    () => loadSettings(true)
  );


  [sessions, work, breakTime].forEach(
    el => {

      el.addEventListener(
        "change",
        () => loadSettings(true)
      );

    }
  );


  loadSettings(true);

})();

</script>

</body>
</html>
